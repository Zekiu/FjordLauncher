name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
          path: "FjordLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v7
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/FjordLauncher-source FjordLauncher
          mv FjordLauncher-Linux-Qt6-Portable*/FjordLauncher-portable.tar.gz FjordLauncher-Linux-Qt6-Portable.tar.gz
          mv FjordLauncher-Linux-aarch64-Qt6-Portable*/FjordLauncher-portable.tar.gz FjordLauncher-Linux-aarch64-Qt6-Portable.tar.gz
          mv FjordLauncher-*.AppImage/FjordLauncher-*-x86_64.AppImage FjordLauncher-Linux-x86_64.AppImage
          mv FjordLauncher-*.AppImage.zsync/FjordLauncher-*-x86_64.AppImage.zsync FjordLauncher-Linux-x86_64.AppImage.zsync
          mv FjordLauncher-*.AppImage/FjordLauncher-*-aarch64.AppImage FjordLauncher-Linux-aarch64.AppImage
          mv FjordLauncher-*.AppImage.zsync/FjordLauncher-*-aarch64.AppImage.zsync FjordLauncher-Linux-aarch64.AppImage.zsync

          tar --exclude='.git' -czf FjordLauncher.tar.gz FjordLauncher

          for d in FjordLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="FjordLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv FjordLauncher-*.exe ../${NAME}-Setup.exe
            test -n "${INST}" || zip -r -9 "../${NAME}.zip" *
            cd ..
          done

          for d in FjordLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="FjordLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv FjordLauncher-*.exe ../${NAME}-Setup.exe
            test -n "${INST}" || zip -r -9 "../${NAME}.zip" *
            cd ..
          done

          for d in FjordLauncher-Windows-MinGW-arm64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="FjordLauncher-Windows-MinGW-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv FjordLauncher-*.exe ../${NAME}-Setup.exe
            test -n "${INST}" || zip -r -9 "../${NAME}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Fjord Launcher ${{ env.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            FjordLauncher-Linux-x86_64.AppImage
            FjordLauncher-Linux-x86_64.AppImage.zsync
            FjordLauncher-Linux-aarch64.AppImage
            FjordLauncher-Linux-aarch64.AppImage.zsync
            FjordLauncher-Linux-Qt6-Portable.tar.gz
            FjordLauncher-Linux-aarch64-Qt6-Portable.tar.gz
            FjordLauncher-Windows-MinGW-w64.zip
            FjordLauncher-Windows-MinGW-w64-Portable.zip
            FjordLauncher-Windows-MinGW-w64-Setup.exe
            FjordLauncher-Windows-MinGW-arm64.zip
            FjordLauncher-Windows-MinGW-arm64-Portable.zip
            FjordLauncher-Windows-MinGW-arm64-Setup.exe
            FjordLauncher-Windows-MSVC-arm64.zip
            FjordLauncher-Windows-MSVC-arm64-Portable.zip
            FjordLauncher-Windows-MSVC-arm64-Setup.exe
            FjordLauncher-Windows-MSVC.zip
            FjordLauncher-Windows-MSVC-Portable.zip
            FjordLauncher-Windows-MSVC-Setup.exe
            FjordLauncher.tar.gz
